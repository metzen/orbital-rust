[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# [target.wasm32-unknown-unknown]
# TODO: This tool can run into the issues described in
# https://github.com/wasm-bindgen/wasm-bindgen/issues/2757
#
# Prefer using the `run-wasm` alternative.
# runner = "wasm-server-runner"

[alias]
run-wasm = "run --release --package run-wasm --"
