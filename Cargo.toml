[package]
name = "orbital"
version = "0.1.0"
edition = "2021"

[dependencies]
#bevy = { version = "0.14.2" }
bevy = { version = "0.15.0", features = ["dynamic_linking"] }
# bevy_framepace = "0.17"
bevy_framepace = { path = "../bevy_framepace" }
big_space = "0.8"
rand = "0.8.5"

[build-dependencies]
embed-resource = "1.6.3"


[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable max optimizations for dependencies, but not for our code:
[profile.dev.package."*"]
opt-level = 3
