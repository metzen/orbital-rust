[package]
name = "orbital"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16.0" }
bevy_framepace = "0.19.1"
bevy-inspector-egui = "0.33.1"
big_space = { version = "0.10", features = ["bevy_render"] }
clap = { version = "4.5.37", features = ["derive"] }
either = "1.15.0"
image = "0.25.6"
leafwing-input-manager = "0.17"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
rand = "0.9.2"
winit = "0.30.12"

[build-dependencies]
embed-resource = "1.6.3"

[features]
dev = [
    "bevy/dynamic_linking",
]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
# debug = true

# Enable max optimizations for dependencies, but not for our code:
[profile.dev.package."*"]
opt-level = 3
